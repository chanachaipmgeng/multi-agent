# pre-commit hooks for emaw-config.  Install once:  make hooks  (→ pre-commit install)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^webhook-gateway/
      - id: ruff-format
        files: ^webhook-gateway/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^(docker-compose\.yml|\.sops\.yaml)$   # compose anchors / sops are fine but noisy
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
