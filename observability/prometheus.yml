# Prometheus scrape config (D4.1 / design §8.2)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: webhook-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["webhook-gateway:8700"]
        labels: { service: webhook-gateway }

  - job_name: queue-adapters
    metrics_path: /metrics
    static_configs:
      - targets:
          - router:9100
          - adapter-dev-frontend:9100
          - adapter-dev-backend:9100
          - adapter-reviewer:9100
          - adapter-qa:9100
          - adapter-devops:9100
        labels: { service: queue-adapter }

  - job_name: cloudflared
    metrics_path: /metrics
    static_configs:
      - targets: ["cloudflared:2000"]
        labels: { service: cloudflared }
    # target may be down when profile ingress is off — scrape fails soft

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
