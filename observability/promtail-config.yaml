# Promtail → Loki with D4.2 redaction stages (mirrors queue-adapter/app/redaction.py)
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
    pipeline_stages:
      - docker: {}
      - regex:
          expression: '(?P<line>.*)'
      - replace:
          expression: 'glpat-[0-9A-Za-z_\-]{20,}'
          replace: 'glpat-[REDACTED]'
      - replace:
          expression: '\bsk-[A-Za-z0-9_\-]{16,}'
          replace: 'sk-[REDACTED]'
      - replace:
          expression: '(?i)\bBearer\s+[A-Za-z0-9._\-]{8,}'
          replace: 'Bearer [REDACTED]'
      - replace:
          expression: 'AGE-SECRET-KEY-1[0-9A-Z]{58}'
          replace: 'AGE-SECRET-KEY-1[REDACTED]'
      - replace:
          expression: '(?i)\b([A-Z0-9_]*(?:PASSWORD|SECRET|TOKEN|API_KEY)[A-Z0-9_]*)\s*[=:]\s*[''"]?[^\s''"]{6,}'
          replace: '${1}=[REDACTED]'
      # Extract correlation ids into structured_metadata (not stream labels — avoid cardinality blow-up)
      - regex:
          expression: 'task_id=(?P<task_id>[A-Za-z0-9_.-]+)'
      - regex:
          expression: 'trace_id=(?P<trace_id>[A-Za-z0-9_.-]+)'
      - regex:
          expression: 'event_uuid=(?P<event_uuid>[A-Za-z0-9_.-]+)'
      - structured_metadata:
          task_id:
          trace_id:
          event_uuid:
