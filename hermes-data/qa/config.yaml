# Hermes profile: qa  (verify key names with `hermes config list` — DECISION-1)
identity:
  name: qa
  role: qa-automation
  trace_prefix: qa

model:
  primary: ${LLM_MODEL_MID:-openrouter/anthropic/claude-3.5-haiku}   # mid-tier
  fallback: ${LLM_FALLBACK_MODEL:-openrouter/openai/gpt-4o-mini}
  api_key_file: /run/secrets/llm_key_qa
  max_context_tokens: 128000

terminal:
  backend: docker
  sandbox:
    image: ${SANDBOX_IMAGE_PLAYWRIGHT:-mcr.microsoft.com/playwright:v1.47.0-jammy}
    cpus: 2
    memory: 6g
    pids_limit: 1024
    command_timeout_minutes: 20
    e2e_port_range: "3001-3010"

gitlab:
  base_url: ${GITLAB_BASE_URL:-https://gitlab.com}
  token_file: /run/secrets/gitlab_token_qa   # read_api + write_repository

workspace:
  root: /workspace
  mode: rw
  allowed_paths: ["e2e/**", "tests/**", "**/*.spec.ts", "**/test_*.py", "playwright.config.*"]
  worktrees: /workspace/.worktrees

queue:
  redis_url: redis://redis:6379/0
  inbox_stream: stream:qa
  results_stream: stream:results
  consumer_group: qa

policy:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml

budgets:
  token_budget_per_task: 200000
  self_heal_limit: 3

skills_dir: /opt/data/skills
memory_dir: /opt/data/memory
log_level: ${HERMES_LOG_LEVEL:-info}
