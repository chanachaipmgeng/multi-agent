# Hermes profile: reviewer — real schema (DECISION-1 / v0.21.5)

model:
  provider: openrouter
  default: anthropic/claude-sonnet-4

fallback_providers:
  - provider: openrouter
    model: openai/o3-mini

terminal:
  backend: local
  cwd: /workspace
  timeout: 1200

approvals:
  mode: smart
  deny:
    - "git push*"
    - "git commit*"
    - "docker system prune*"
    - "*DROP TABLE*"
    - "rm -rf /*"
    - "rm -rf /"

worktree: false
worktree_sync: false

skills:
  auto_load:
    - review-with-socraticode

# SocratiCode MCP (DECISION-6) — enable in Phase 2 after license/key confirmed.
# Infra: `make up-socraticode` → socraticode-ollama + socraticode-qdrant on workers net.
# Host-side MCP: OLLAMA_URL=http://127.0.0.1:11435 QDRANT_URL=http://127.0.0.1:16333
# In-compose (reviewer container): use service DNS below.
mcp_servers:
  socraticode:
    # Disabled until DECISION-6 license holder + SECRET_SOCRATICODE_KEY are set
    # command: npx
    # args: ["-y", "socraticode", "mcp"]
    # env:
    #   SOCRATICODE_API_KEY: ${SOCRATICODE_API_KEY}
    #   OLLAMA_URL: http://socraticode-ollama:11434
    #   QDRANT_URL: http://socraticode-qdrant:6333

database:
  journal_mode: delete

emaw:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml
  inbox_stream: stream:reviewer
  results_stream: stream:results
  token_budget_per_task: 300000
