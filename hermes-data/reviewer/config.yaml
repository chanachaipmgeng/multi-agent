# Hermes profile: reviewer  (verify key names with `hermes config list` — DECISION-1)
identity:
  name: reviewer
  role: code-reviewer
  trace_prefix: rev

model:
  primary: ${LLM_MODEL_REASONING:-openrouter/anthropic/claude-3.5-sonnet}   # high-reasoning model
  fallback: ${LLM_FALLBACK_MODEL:-openrouter/openai/o3-mini}
  api_key_file: /run/secrets/llm_key_reviewer
  max_context_tokens: 200000
  local_endpoint: http://inference-ollama:11434

terminal:
  backend: docker
  sandbox:
    image: ${SANDBOX_IMAGE_NODE:-node:20-bookworm}   # socraticode CLI is a Node tool
    cpus: 2
    memory: 4g
    pids_limit: 512
    command_timeout_minutes: 20

gitlab:
  base_url: ${GITLAB_BASE_URL:-https://gitlab.com}
  token_file: /run/secrets/gitlab_token_readonly   # read_api only

workspace:
  root: /workspace
  mode: ro
  worktrees: /workspace/.worktrees

# SocratiCode via CLI + MCP (DECISION-6). Enabled in Phase 2.
mcp_servers:
  socraticode:
    enabled: false
    command: ["npx", "-y", "socraticode", "mcp"]
    env:
      SOCRATICODE_API_KEY_FILE: /run/secrets/socraticode_key
    tools: [analyze_blast_radius, get_dependencies]

queue:
  redis_url: redis://redis:6379/0
  inbox_stream: stream:reviewer
  results_stream: stream:results
  consumer_group: reviewer

policy:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml

budgets:
  token_budget_per_task: 300000

skills_dir: /opt/data/skills
memory_dir: /opt/data/memory
log_level: ${HERMES_LOG_LEVEL:-info}
