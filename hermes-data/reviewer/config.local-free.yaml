# Hermes profile: reviewer — local-free override (DECISION-15 + DECISION-6)

model:
  provider: custom
  base_url: http://inference-ollama:11434/v1
  default: qwen2.5-coder:7b
  ollama_num_ctx: 65536

fallback_providers:
  - provider: custom
    base_url: http://inference-ollama:11434/v1
    model: qwen2.5-coder:7b

terminal:
  backend: local
  cwd: /workspace
  timeout: 1200

approvals:
  mode: smart
  deny:
    - "git push*"
    - "git commit*"
    - "docker system prune*"
    - "*DROP TABLE*"
    - "rm -rf /*"
    - "rm -rf /"

worktree: false
worktree_sync: false

skills:
  auto_load:
    - review-with-socraticode
    - deep-review

# SocratiCode MCP — local AGPL, no API key (same as config.yaml)
mcp_servers:
  socraticode:
    command: npx
    args: ["-y", "socraticode"]
    env:
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIMENSIONS: "768"
      OLLAMA_MODE: external
      OLLAMA_URL: http://socraticode-ollama:11434
      QDRANT_MODE: external
      QDRANT_URL: http://socraticode-qdrant:6333
      npm_config_cache: /opt/data/.npm

database:
  journal_mode: delete

emaw:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml
  inbox_stream: stream:reviewer
  results_stream: stream:results
  token_budget_per_task: 300000
