# Hermes profile: dev-backend — real schema (DECISION-1 / v0.21.5)
# backend-api is often `confidential` → prefer Ollama when OPENROUTER is disabled for that task.

model:
  provider: openrouter
  default: anthropic/claude-sonnet-4

fallback_providers:
  - provider: openrouter
    model: openai/gpt-4o
  # When using on-prem for confidential repos (DECISION-3), set via env / hermes model:
  # - provider: custom
  #   model: qwen2.5-coder:32b
  #   base_url: http://inference-ollama:11434/v1

terminal:
  backend: local                 # DECISION-14 for compose
  cwd: /workspace/backend-api
  timeout: 1200

approvals:
  mode: smart
  deny:
    - "git push* main*"
    - "git push* master*"
    - "git push* release/*"
    - "docker system prune*"
    - "*DROP TABLE*"
    - "*DROP DATABASE*"
    - "*DROP COLUMN*"
    - "rm -rf /*"
    - "rm -rf /"

worktree: true
worktree_sync: true

skills:
  auto_load:
    - dev-flow
    - resolve-issue
    - review-code

database:
  journal_mode: delete

emaw:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml
  allowed_projects: [backend-api, sandbox-smoke]
  inbox_stream: stream:dev-backend
  results_stream: stream:results
  token_budget_per_task: 400000
  self_heal_limit: 3
