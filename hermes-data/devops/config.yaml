# Hermes profile: devops — real schema (DECISION-1 / v0.21.5)

model:
  provider: openrouter
  default: anthropic/claude-sonnet-4

fallback_providers:
  - provider: openrouter
    model: openai/gpt-4o

terminal:
  backend: local
  cwd: /workspace
  timeout: 1200

approvals:
  mode: smart
  deny:
    - "git push* main*"
    - "git push* master*"
    - "git push* release/*"
    - "docker system prune*"
    - "*DROP TABLE*"
    - "*DROP DATABASE*"
    - "rm -rf /*"
    - "rm -rf /"

worktree: true
worktree_sync: true

skills:
  auto_load:
    - incident-triage

database:
  journal_mode: delete

emaw:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml
  allowed_paths: [".gitlab-ci.yml", "Dockerfile*", "docker-compose*.yml", "deploy/**", "infra/**", ".github/**"]
  inbox_stream: stream:devops
  results_stream: stream:results
  token_budget_per_task: 300000
  self_heal_limit: 2
