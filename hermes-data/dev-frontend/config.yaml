# Hermes profile: dev-frontend — real schema (DECISION-1 / v0.21.5)

model:
  provider: openrouter
  default: anthropic/claude-sonnet-4

fallback_providers:
  - provider: openrouter
    model: openai/gpt-4o

terminal:
  backend: local                 # DECISION-14 for compose
  cwd: /workspace/frontend-app
  timeout: 1200                  # 20 min — matches platform-policy sandbox limit
  # Host/WSL2 path (option A):
  # backend: docker
  # docker_image: nousresearch/hermes-sandbox:desktop
  # docker_mount_cwd_to_workspace: true
  # docker_forward_env: [GITLAB_TOKEN, GITLAB_HOST, OPENROUTER_API_KEY]

approvals:
  mode: smart
  deny:
    - "git push* main*"
    - "git push* master*"
    - "git push* release/*"
    - "docker system prune*"
    - "*DROP TABLE*"
    - "*DROP DATABASE*"
    - "rm -rf /*"
    - "rm -rf /"

worktree: true
worktree_sync: true

skills:
  auto_load:
    - dev-flow
    - resolve-issue
    - review-code

database:
  journal_mode: delete

emaw:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml
  allowed_projects: [frontend-app, sandbox-smoke]
  inbox_stream: stream:dev-frontend
  results_stream: stream:results
  token_budget_per_task: 400000
  self_heal_limit: 3
