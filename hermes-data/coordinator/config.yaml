# Hermes profile: coordinator — real schema (DECISION-1 / v0.21.5)
# Secrets live in /opt/data/.env (TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS,
# OPENROUTER_API_KEY / LLM key, GITLAB_TOKEN, API_SERVER_KEY). See docs/hermes-capability-check.md.

model:
  provider: openrouter
  default: anthropic/claude-sonnet-4

fallback_providers:
  - provider: openrouter
    model: openai/gpt-4o-mini

terminal:
  # DECISION-14 (compose): container is the sandbox — no docker.sock.
  # On host/WSL2 Ubuntu Phase 0 path use: backend: docker + docker_image below.
  backend: local
  cwd: /workspace
  timeout: 180
  # docker_image: nousresearch/hermes-sandbox:desktop
  # docker_mount_cwd_to_workspace: true

approvals:
  mode: smart
  deny:
    - "git push* main*"
    - "git push* master*"
    - "git push* release/*"
    - "docker system prune*"
    - "*DROP TABLE*"
    - "*DROP DATABASE*"
    - "rm -rf /*"
    - "rm -rf /"

worktree: false          # coordinator never mutates repos
worktree_sync: false

skills:
  auto_load:
    - human-approval-gate
    - switch-context

database:
  # Named volume preferred; delete is safe on Windows bind-mounts (WAL + drvfs).
  journal_mode: delete

# EMAW platform paths (read by skills / SOUL.md, not native Hermes keys)
emaw:
  agent_md: /opt/data/AGENT.md
  platform_policy: /config/policies/platform-policy.yaml
  projects: /config/projects.yaml
  rbac: /opt/data/rbac.yaml
  inbox_stream: stream:tasks
  results_stream: stream:results
  token_budget_per_task: 50000
