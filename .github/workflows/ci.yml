name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gateway-tests:
    name: webhook-gateway · lint + unit + postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: emaw
          POSTGRES_PASSWORD: emaw
          POSTGRES_DB: emaw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emaw -d emaw_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: webhook-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: pytest -q -m integration
        env:
          TEST_DATABASE_URL: postgresql://emaw:emaw@localhost:5432/emaw_test

  adapter-tests:
    name: queue-adapter · lint + unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: queue-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  repo-checks:
    name: gitleaks · compose config · scripts · skills sync · smoke exit codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
      - name: docker compose config
        run: |
          mkdir -p secrets
          for f in gitlab_webhook_secret pg_password tunnel_token telegram_token socraticode_key hermes_api_key \
                   llm_key_coordinator llm_key_dev_frontend llm_key_dev_backend llm_key_reviewer llm_key_devops llm_key_qa \
                   gitlab_token_readonly gitlab_token_frontend gitlab_token_backend gitlab_token_ci gitlab_token_qa \
                   minio_agent_secret minio_root_password; do
            echo ci-placeholder > "secrets/$f"
          done
          cp config/rbac.example.yaml config/rbac.yaml
          docker compose --profile agents --profile ingress --profile onprem-llm --profile socraticode config -q
          docker compose -f docker-compose.yml -f docker-compose.local-free.yml \
            --profile agents --profile socraticode --profile onprem-llm config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile agents --profile ingress config -q
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh examples/sandbox-smoke/test.sh
      - name: skills sync is reproducible
        run: scripts/sync-skills.sh && scripts/sync-skills.sh --check
      - name: sandbox-smoke exit codes
        run: |
          (cd examples/sandbox-smoke && ./test.sh)
          if (cd examples/sandbox-smoke && SMOKE_FORCE_FAIL=1 ./test.sh); then echo "expected exit 1"; exit 1; fi
