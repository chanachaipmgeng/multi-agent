# Enterprise Multi-Agent Workspace — Phase 3 multi-agent compose (design §A.1 / DECISION-16)
#
# Default services (plain `docker compose up -d`):
#   redis, postgres, webhook-gateway, router, minio
#   + adapter-{dev-frontend,dev-backend,reviewer,qa,devops}
# Profiles:
#   agents      → 6 Hermes profiles as separate containers (coordinator + 5 workers)
#   single      → legacy single queue-adapter (Phase 1–2 host install; mutually exclusive w/ router)
#   ingress     → cloudflared Named Tunnel connector (needs secrets/tunnel_token)
#   onprem-llm  → Ollama for repos classified confidential/restricted (DECISION-3)
#   socraticode → Ollama (embeddings) + Qdrant for SocratiCode MCP (DECISION-6 / Phase 2)
#
# Secrets are file-based (./secrets/*, created by `make secrets-decrypt` from .env.enc via SOPS).
# No service publishes a port outside 127.0.0.1; external traffic arrives only via the tunnel.

# Hermes Agent v0.21.5 (DECISION-1). Official image uses s6-overlay ENTRYPOINT as root —
# do NOT set user:/read_only: (they break supervision). Isolation = no docker.sock,
# scoped mounts, security_opt, DECISION-14 terminal.backend=local inside the container.
x-hermes-common: &hermes-common
  image: ${HERMES_IMAGE:-nousresearch/hermes-agent@sha256:d4da4a40cd7a28aba983775d9fd31d94cbf153eeb0cb9e844d6d0f612b7c24db}
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  environment:
    - TZ=${TZ:-Asia/Bangkok}
    - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
    - HERMES_HOME=/opt/data
    - API_SERVER_ENABLED=true
    - API_SERVER_HOST=0.0.0.0
    - API_SERVER_PORT=8642
    - API_SERVER_KEY_FILE=/run/secrets/hermes_api_key
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }
  depends_on:
    redis: { condition: service_healthy }
    postgres: { condition: service_healthy }
  profiles: ["agents"]

# Shared build/image/security for router + per-role workers (DECISION-16).
# Each service overrides `environment:` fully (Compose cannot merge YAML lists).
x-adapter-common: &adapter-common
  build: ./queue-adapter
  image: emaw/queue-adapter:dev
  secrets: [pg_password, gitlab_token_readonly, telegram_token, hermes_api_key, minio_root_password]
  volumes:
    - adapter-outbox:/var/lib/queue-adapter
    - ./config:/config:ro
  networks: [control, workers]
  depends_on:
    redis: { condition: service_healthy }
    postgres: { condition: service_healthy }
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  # ------------------------------------------------------------ platform
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    networks: [control, workers]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=emaw
      - POSTGRES_DB=emaw
      - POSTGRES_PASSWORD_FILE=/run/secrets/pg_password
    secrets: [pg_password]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    networks: [control]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emaw -d emaw"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ------------------------------------------------------------- ingress
  webhook-gateway:
    build: ./webhook-gateway
    image: emaw/webhook-gateway:dev
    environment:
      - PORT=8700
      - LOG_LEVEL=${GATEWAY_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - PROJECTS_FILE=/config/projects.yaml
      - RBAC_FILE=/config/rbac.yaml
      - GITLAB_WEBHOOK_SECRET_FILE=/run/secrets/gitlab_webhook_secret
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - TASK_STREAM=stream:tasks
      - CONTROL_PREFIX=emaw:control
    secrets: [gitlab_webhook_secret, pg_password, hermes_api_key]
    volumes: ["./config:/config:ro"]
    ports: ["127.0.0.1:${GATEWAY_PORT:-8700}:8700"]
    networks: [edge, control]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8700/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------- Phase 3 adapters
  router:
    <<: *adapter-common
    container_name: emaw-router
    secrets: [pg_password, gitlab_token_readonly, telegram_token, hermes_api_key]
    environment:
      - LOG_LEVEL=${ADAPTER_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - MODE=router
      - ROLE=router
      - TASK_STREAM=stream:tasks
      - RESULTS_STREAM=stream:results
      - DEAD_LETTER_STREAM=stream:dead-letter
      - CONSUMER_GROUP=router
      # Stable name so pause-deferred PEL survives container recreate.
      - CONSUMER_NAME=router
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - DISPATCHER=dryrun
      - PROJECTS_FILE=/config/projects.yaml
      - CONTROL_PREFIX=emaw:control
      - METRICS_PORT=9100
      - TELEGRAM_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - GITLAB_TOKEN_FILE=/run/secrets/gitlab_token_readonly
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - OUTBOX_DIR=/var/lib/queue-adapter/outbox
      # Reclaim pause-deferred / crashed deliveries within 30s (design E11).
      - CLAIM_MIN_IDLE_MS=30000

  adapter-dev-frontend:
    <<: *adapter-common
    container_name: emaw-adapter-dev-frontend
    environment:
      - LOG_LEVEL=${ADAPTER_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - MODE=worker
      - ROLE=dev-frontend
      - TASK_STREAM=stream:dev-frontend
      - CONSUMER_GROUP=adapter-dev-frontend
      - RESULTS_STREAM=stream:results
      - DEAD_LETTER_STREAM=stream:dead-letter
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - DISPATCHER=${ADAPTER_DISPATCHER:-dryrun}
      - HERMES_API_URL=http://dev-frontend:8642
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - OUTBOX_DIR=/var/lib/queue-adapter/outbox
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_TOKEN_FILE=/run/secrets/gitlab_token_readonly
      - TELEGRAM_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CONTROL_PREFIX=emaw:control
      - METRICS_PORT=9100
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-emaw}
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_root_password
      - MINIO_BUCKET=${MINIO_BUCKET:-emaw-artifacts}
      - PROJECTS_FILE=/config/projects.yaml

  adapter-dev-backend:
    <<: *adapter-common
    container_name: emaw-adapter-dev-backend
    environment:
      - LOG_LEVEL=${ADAPTER_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - MODE=worker
      - ROLE=dev-backend
      - TASK_STREAM=stream:dev-backend
      - CONSUMER_GROUP=adapter-dev-backend
      - RESULTS_STREAM=stream:results
      - DEAD_LETTER_STREAM=stream:dead-letter
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - DISPATCHER=${ADAPTER_DISPATCHER:-dryrun}
      - HERMES_API_URL=http://dev-backend:8642
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - OUTBOX_DIR=/var/lib/queue-adapter/outbox
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_TOKEN_FILE=/run/secrets/gitlab_token_readonly
      - TELEGRAM_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CONTROL_PREFIX=emaw:control
      - METRICS_PORT=9100
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-emaw}
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_root_password
      - MINIO_BUCKET=${MINIO_BUCKET:-emaw-artifacts}
      - PROJECTS_FILE=/config/projects.yaml

  adapter-reviewer:
    <<: *adapter-common
    container_name: emaw-adapter-reviewer
    environment:
      - LOG_LEVEL=${ADAPTER_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - MODE=worker
      - ROLE=reviewer
      - TASK_STREAM=stream:reviewer
      - CONSUMER_GROUP=adapter-reviewer
      - RESULTS_STREAM=stream:results
      - DEAD_LETTER_STREAM=stream:dead-letter
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - DISPATCHER=${ADAPTER_DISPATCHER:-dryrun}
      - HERMES_API_URL=http://reviewer:8642
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - OUTBOX_DIR=/var/lib/queue-adapter/outbox
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_TOKEN_FILE=/run/secrets/gitlab_token_readonly
      - TELEGRAM_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CONTROL_PREFIX=emaw:control
      - METRICS_PORT=9100
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-emaw}
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_root_password
      - MINIO_BUCKET=${MINIO_BUCKET:-emaw-artifacts}
      - PROJECTS_FILE=/config/projects.yaml

  adapter-qa:
    <<: *adapter-common
    container_name: emaw-adapter-qa
    environment:
      - LOG_LEVEL=${ADAPTER_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - MODE=worker
      - ROLE=qa
      - TASK_STREAM=stream:qa
      - CONSUMER_GROUP=adapter-qa
      - RESULTS_STREAM=stream:results
      - DEAD_LETTER_STREAM=stream:dead-letter
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - DISPATCHER=${ADAPTER_DISPATCHER:-dryrun}
      - HERMES_API_URL=http://qa:8642
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - OUTBOX_DIR=/var/lib/queue-adapter/outbox
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_TOKEN_FILE=/run/secrets/gitlab_token_readonly
      - TELEGRAM_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CONTROL_PREFIX=emaw:control
      - METRICS_PORT=9100
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-emaw}
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_root_password
      - MINIO_BUCKET=${MINIO_BUCKET:-emaw-artifacts}
      - PROJECTS_FILE=/config/projects.yaml

  adapter-devops:
    <<: *adapter-common
    container_name: emaw-adapter-devops
    environment:
      - LOG_LEVEL=${ADAPTER_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - MODE=worker
      - ROLE=devops
      - TASK_STREAM=stream:devops
      - CONSUMER_GROUP=adapter-devops
      - RESULTS_STREAM=stream:results
      - DEAD_LETTER_STREAM=stream:dead-letter
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - DISPATCHER=${ADAPTER_DISPATCHER:-dryrun}
      - HERMES_API_URL=http://devops:8642
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - OUTBOX_DIR=/var/lib/queue-adapter/outbox
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_TOKEN_FILE=/run/secrets/gitlab_token_readonly
      - TELEGRAM_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CONTROL_PREFIX=emaw:control
      - METRICS_PORT=9100
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-emaw}
      - MINIO_SECRET_KEY_FILE=/run/secrets/minio_root_password
      - MINIO_BUCKET=${MINIO_BUCKET:-emaw-artifacts}
      - PROJECTS_FILE=/config/projects.yaml

  # Phase 1–2 compat: single adapter (profile `single` — do not combine with router workers)
  queue-adapter:
    <<: *adapter-common
    profiles: ["single"]
    environment:
      - LOG_LEVEL=${ADAPTER_LOG_LEVEL:-info}
      - REDIS_URL=redis://redis:6379/0
      - MODE=worker
      - ROLE=hermes-single
      - TASK_STREAM=stream:tasks
      - CONSUMER_GROUP=hermes-single
      - RESULTS_STREAM=stream:results
      - DEAD_LETTER_STREAM=stream:dead-letter
      - DATABASE_URL=postgresql://emaw:$${PG_PASSWORD}@postgres:5432/emaw
      - PG_PASSWORD_FILE=/run/secrets/pg_password
      - DISPATCHER=${ADAPTER_DISPATCHER:-dryrun}
      - HERMES_API_URL=${HERMES_API_URL:-http://dev-backend:8642}
      - HERMES_API_KEY_FILE=/run/secrets/hermes_api_key
      - SINGLE_AGENT_NAME=hermes-single
      - OUTBOX_DIR=/var/lib/queue-adapter/outbox
      - GITLAB_BASE_URL=${GITLAB_BASE_URL:-https://gitlab.com}
      - GITLAB_TOKEN_FILE=/run/secrets/gitlab_token_readonly
      - TELEGRAM_TOKEN_FILE=/run/secrets/telegram_token
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - CONTROL_PREFIX=emaw:control
      - METRICS_PORT=9100
      - PROJECTS_FILE=/config/projects.yaml

  minio:
    # MinIO has no *_FILE env support — password from .env / compose interpolation.
    # Adapters authenticate as root (SigV4) via secrets/minio_root_password (local-free).
    # Prod may switch to a dedicated agent key (secrets/minio_agent_secret + minio-init).
    image: minio/minio:latest
    container_name: emaw-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-emaw}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-emaw-minio-dev-change-me}
    volumes: ["minio-data:/data"]
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [control, workers]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  cloudflared:
    # Placeholder until DECISION-5 (domain + Cloudflare account) is confirmed.
    # Create the tunnel once (see cloudflared/README.md) and put its token in secrets/tunnel_token.
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/tunnel_token
    secrets: [tunnel_token]
    networks: [edge]
    depends_on: [webhook-gateway]
    profiles: ["ingress"]
    restart: unless-stopped

  # ------------------------------------------------- hermes agent profiles
  # Mutable state lives in named volumes (avoids SQLite WAL corruption on Windows
  # bind-mounts). Seed files (config/SOUL/AGENT/skills/.env) are bind-mounted on top.
  # Run `scripts/hermes-seed-env.sh` + `make skills-sync` before `up-agents`.
  coordinator:
    <<: *hermes-common
    container_name: emaw-coordinator
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY_FILE=/run/secrets/hermes_api_key
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
    volumes:
      - hermes-coordinator-data:/opt/data
      - ./hermes-data/coordinator/config.yaml:/opt/data/config.yaml:ro
      - ./hermes-data/coordinator/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes-data/coordinator/AGENT.md:/opt/data/AGENT.md:ro
      - ./hermes-data/coordinator/skills:/opt/data/skills:ro
      - ./hermes-data/coordinator/.env:/opt/data/.env:ro
      - ./workspace:/workspace:ro
      - ./config:/config:ro
    secrets: [telegram_token, llm_key_coordinator, gitlab_token_readonly, pg_password, hermes_api_key]
    ports:
      - "127.0.0.1:${HERMES_DASHBOARD_PORT:-9119}:9119"
      - "127.0.0.1:${HERMES_API_PORT:-8642}:8642"
    networks: [control, workers]

  dev-frontend:
    <<: *hermes-common
    container_name: emaw-dev-frontend
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY_FILE=/run/secrets/hermes_api_key
    volumes:
      - hermes-dev-frontend-data:/opt/data
      - ./hermes-data/dev-frontend/config.yaml:/opt/data/config.yaml:ro
      - ./hermes-data/dev-frontend/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes-data/dev-frontend/AGENT.md:/opt/data/AGENT.md:ro
      - ./hermes-data/dev-frontend/skills:/opt/data/skills:ro
      - ./hermes-data/dev-frontend/.env:/opt/data/.env:ro
      - ./workspace/frontend-app:/workspace/frontend-app
      - ./workspace/.worktrees:/workspace/.worktrees
      - ./config:/config:ro
    secrets: [llm_key_dev_frontend, gitlab_token_frontend, hermes_api_key]
    networks: [workers]
    deploy: { resources: { limits: { cpus: "2.0", memory: 4G } } }

  dev-backend:
    <<: *hermes-common
    container_name: emaw-dev-backend
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY_FILE=/run/secrets/hermes_api_key
    volumes:
      - hermes-dev-backend-data:/opt/data
      - ./hermes-data/dev-backend/config.yaml:/opt/data/config.yaml:ro
      - ./hermes-data/dev-backend/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes-data/dev-backend/AGENT.md:/opt/data/AGENT.md:ro
      - ./hermes-data/dev-backend/skills:/opt/data/skills:ro
      - ./hermes-data/dev-backend/.env:/opt/data/.env:ro
      - ./workspace/backend-api:/workspace/backend-api
      - ./examples/sandbox-smoke:/workspace/sandbox-smoke
      - ./workspace/.worktrees:/workspace/.worktrees
      - ./config:/config:ro
    secrets: [llm_key_dev_backend, gitlab_token_backend, hermes_api_key]
    ports: ["127.0.0.1:${HERMES_BACKEND_API_PORT:-8643}:8642"]
    networks: [workers]
    deploy: { resources: { limits: { cpus: "2.0", memory: 4G } } }

  reviewer:
    <<: *hermes-common
    container_name: emaw-reviewer
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY_FILE=/run/secrets/hermes_api_key
    volumes:
      - hermes-reviewer-data:/opt/data
      - ./hermes-data/reviewer/config.yaml:/opt/data/config.yaml:ro
      - ./hermes-data/reviewer/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes-data/reviewer/AGENT.md:/opt/data/AGENT.md:ro
      - ./hermes-data/reviewer/skills:/opt/data/skills:ro
      - ./hermes-data/reviewer/.env:/opt/data/.env:ro
      - ./workspace:/workspace:ro
      - ./config:/config:ro
    secrets: [llm_key_reviewer, socraticode_key, gitlab_token_readonly, hermes_api_key]
    networks: [workers]

  devops:
    <<: *hermes-common
    container_name: emaw-devops
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY_FILE=/run/secrets/hermes_api_key
    volumes:
      - hermes-devops-data:/opt/data
      - ./hermes-data/devops/config.yaml:/opt/data/config.yaml:ro
      - ./hermes-data/devops/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes-data/devops/AGENT.md:/opt/data/AGENT.md:ro
      - ./hermes-data/devops/skills:/opt/data/skills:ro
      - ./hermes-data/devops/.env:/opt/data/.env:ro
      - ./workspace:/workspace
      - ./config:/config:ro
    secrets: [llm_key_devops, gitlab_token_ci, hermes_api_key]
    networks: [workers]

  qa:
    <<: *hermes-common
    container_name: emaw-qa
    command: ["gateway", "run"]
    environment:
      - TZ=${TZ:-Asia/Bangkok}
      - HERMES_LOG_LEVEL=${HERMES_LOG_LEVEL:-info}
      - HERMES_HOME=/opt/data
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY_FILE=/run/secrets/hermes_api_key
    volumes:
      - hermes-qa-data:/opt/data
      - ./hermes-data/qa/config.yaml:/opt/data/config.yaml:ro
      - ./hermes-data/qa/SOUL.md:/opt/data/SOUL.md:ro
      - ./hermes-data/qa/AGENT.md:/opt/data/AGENT.md:ro
      - ./hermes-data/qa/skills:/opt/data/skills:ro
      - ./hermes-data/qa/.env:/opt/data/.env:ro
      - ./workspace:/workspace
      - ./config:/config:ro
    secrets: [llm_key_qa, gitlab_token_qa, hermes_api_key]
    networks: [workers]
    deploy: { resources: { limits: { cpus: "2.0", memory: 6G } } }   # Playwright

  # --------------------------------------------------- optional inference
  inference-ollama:
    image: ollama/ollama:latest
    volumes: ["ollama-data:/root/.ollama"]
    networks: [inference, workers]
    profiles: ["onprem-llm"]
    restart: unless-stopped

  # ------------------------------------------- SocratiCode infra (Phase 2)
  # Separate from inference-ollama: embeddings/index stay on this pair so
  # confidential LLM traffic (DECISION-3) never shares the same model store.
  # Host ports are loopback-only for host-side `npx socraticode mcp`;
  # in-compose clients use http://socraticode-ollama:11434 and
  # http://socraticode-qdrant:6333 on the workers network.
  socraticode-ollama:
    image: ollama/ollama:latest
    container_name: socraticode-ollama
    volumes: ["socraticode-ollama-data:/root/.ollama"]
    ports: ["127.0.0.1:${SOCRATICODE_OLLAMA_PORT:-11435}:11434"]
    networks: [workers]
    profiles: ["socraticode"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  socraticode-qdrant:
    image: qdrant/qdrant:v1.17.0
    container_name: socraticode-qdrant
    volumes: ["socraticode-qdrant-data:/qdrant/storage"]
    ports:
      - "127.0.0.1:${SOCRATICODE_QDRANT_HTTP_PORT:-16333}:6333"
      - "127.0.0.1:${SOCRATICODE_QDRANT_GRPC_PORT:-16334}:6334"
    networks: [workers]
    profiles: ["socraticode"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  gitlab_webhook_secret: { file: ./secrets/gitlab_webhook_secret }
  pg_password:           { file: ./secrets/pg_password }
  tunnel_token:          { file: ./secrets/tunnel_token }
  telegram_token:        { file: ./secrets/telegram_token }
  socraticode_key:       { file: ./secrets/socraticode_key }
  llm_key_coordinator:   { file: ./secrets/llm_key_coordinator }
  llm_key_dev_frontend:  { file: ./secrets/llm_key_dev_frontend }
  llm_key_dev_backend:   { file: ./secrets/llm_key_dev_backend }
  llm_key_reviewer:      { file: ./secrets/llm_key_reviewer }
  llm_key_devops:        { file: ./secrets/llm_key_devops }
  llm_key_qa:            { file: ./secrets/llm_key_qa }
  gitlab_token_readonly: { file: ./secrets/gitlab_token_readonly }
  gitlab_token_frontend: { file: ./secrets/gitlab_token_frontend }
  gitlab_token_backend:  { file: ./secrets/gitlab_token_backend }
  gitlab_token_ci:       { file: ./secrets/gitlab_token_ci }
  gitlab_token_qa:       { file: ./secrets/gitlab_token_qa }
  hermes_api_key:        { file: ./secrets/hermes_api_key }
  minio_agent_secret:    { file: ./secrets/minio_agent_secret }
  minio_root_password:   { file: ./secrets/minio_root_password }

networks:
  edge: {}
  control: {}
  workers: {}                 # egress to GitLab/LLM allowed; nothing published inbound
  inference: { internal: true }

volumes:
  redis-data: {}
  pg-data: {}
  adapter-outbox: {}
  minio-data: {}
  ollama-data: {}
  # Stable external names — reuse standalone install data; `make up-socraticode`
  # creates them if missing so a fresh pack still works.
  socraticode-ollama-data:
    external: true
    name: socraticode_ollama_data
  socraticode-qdrant-data:
    external: true
    name: socraticode_qdrant_data
  hermes-coordinator-data: {}
  hermes-dev-frontend-data: {}
  hermes-dev-backend-data: {}
  hermes-reviewer-data: {}
  hermes-devops-data: {}
  hermes-qa-data: {}
